{% extends 'base.html' %}

{% block content %}
<div class="col">
    <div class="row">
        <form method="POST">
            <h2>Edit Student with django forms</h2>
            {% comment "" %}
            {% csrf_token %}
            <label for="name">Name</label>
            <input id="name" name="name" type="text" value="{{ student.name }}" required><br><br>

            <label for="cname">Course name</label>
            <select id="cname" name="c_name">
                <option value="">No course</option>
                {% for item in course %}
                    <option value="{{ item.id }}" {% if item.id == student.c_name_id %}selected{% endif %}>
                        {{ item.c_name }}
                    </option>
                {% endfor %}
            </select><br><br>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" value="{{ student.email }}" required><br><br>

            <label for="mobile">Mobile</label>
            <input id="mobile" name="mobile" type="text" value="{{ student.mobile }}" required><br><br>

            <label for="city">City</label>
            <input id="city" name="city" type="text" value="{{ student.city }}" required><br><br>
            {% endcomment %}
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Save</button>
        </form>
    </div>
</div>
{% endblock %}
