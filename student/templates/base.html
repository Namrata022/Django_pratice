{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Portal</title>
    <link href="{% static 'vendor/bootstrap/bootstrap.min.css' %}" rel="stylesheet">

    <style>
        body {
            margin: 0;
        }

        .navbar {
            background-color: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            padding: 0.75rem 1rem;
        }

        .navbar ul {
            display: flex;
            gap: 1.5rem;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .navbar a {
            color: #212529;
            text-decoration: none;
        }

        .navbar a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar" aria-label="Main navigation">
            <ul>
                <li><a href="{% url 'home' %}">Home</a></li>
                <li><a href="{% url 'emp' %}">Employee</a></li>
                <li><a href="{% url 'list' %}">Add Student</a></li>
                <li><a href="{% url 'Elist' %}">Add Employee</a></li>
                <li><a href="{% url 'course_list' %}">Course</a></li>
                <li><a href="{% url 'check_email' %}">Check email</a></li>
                <Li><a href="{% url 'logout' %}" class="btn btn-outline-danger ms-auto">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </Li>
            </ul>
        </nav>
    </header>
    <div class="col-md-10 p-4">
        {% block content %}
            
        {% endblock %}
    </div>
    <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
