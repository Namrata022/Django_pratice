{% extends 'base.html' %}

{% block title %}Create Course{% endblock %}

{% block content %}
<div class="card shadow-lg border-0 rounded-4 col-md-6 mx-auto">
    <div class="card-header bg-success text-white text-center py-3">
        <h3>Create Course</h3>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100">Create Course</button>
            <a class="btn btn-secondary w-100 mt-2" href="{% url 'course_list' %}">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
