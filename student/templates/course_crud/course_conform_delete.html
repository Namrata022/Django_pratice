{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h3 class="text-danger mb-3">Confirm Delete</h3>
                    <p class="mb-4">
                        Are you sure you want to delete
                        <strong>{{ object.course_name }}</strong>?
                    </p>

                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger me-2">Yes, Delete</button>
                        <a href="{% url 'course_list' %}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
